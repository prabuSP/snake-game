<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <h1>Snake</h1>
        <div class="stats">
          <p>Score <strong id="score">0</strong></p>
          <p>Best <strong id="best">0</strong></p>
        </div>
      </header>
      <canvas id="board" width="480" height="480" aria-label="Snake game board"></canvas>
      <p class="hint">Arrow keys or WASD to move · Space to pause · Enter to restart</p>
      <div id="overlay" class="overlay hidden" role="dialog" aria-live="polite">
        <p id="overlay-title">Ready</p>
        <p id="overlay-text">Press an arrow key or WASD to start</p>
        <button id="restart" type="button">Play again</button>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
